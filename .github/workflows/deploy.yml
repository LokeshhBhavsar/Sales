name: Django CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: indusflow-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Django Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip show openpyxl
          python -c "import openpyxl; print('openpyxl version:', openpyxl.__version__)"
          
      - name: Django system check
        run: python manage.py check
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "False"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "False"

      - name: Run tests
        run: python manage.py test
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: "False"

  deploy:
    name: Deploy to Indusflow VPS
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            cd /srv/indusflow

            git fetch origin main
            git reset --hard origin/main

            /srv/indusflow/venv/bin/pip install -r requirements.txt

            /srv/indusflow/venv/bin/python manage.py check

            sudo /usr/bin/systemctl restart indusflow.service
            sudo /usr/bin/systemctl is-active --quiet indusflow.service

            echo "Indusflow deployment completed successfully"